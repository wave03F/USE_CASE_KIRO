<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kiro ghost holding a wrench">
  <defs>
    <linearGradient id="ghostGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a17bff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
  </defs>

  <!-- Ghost body: rounded dome head + wavy bottom -->
  <path fill="url(#ghostGrad)" d="M30 8c-9.4 0-17 7.6-17 17v24.8c0 2 2.3 3 3.8 1.6l2.6-2.4c.8-.8 2.1-.8 3 0l2.5 2.3c.8.8 2.1.8 3 0l2.5-2.3c.8-.8 2.1-.8 3 0l2.6 2.4c1.5 1.4 3.8.4 3.8-1.6V25c0-9.4-7.6-17-17-17z"/>

  <!-- Eyes -->
  <ellipse cx="24" cy="26" rx="3.2" ry="4" fill="#0a0c14"/>
  <ellipse cx="36" cy="26" rx="3.2" ry="4" fill="#0a0c14"/>
  <circle cx="25.1" cy="24.7" r="1" fill="#fff"/>
  <circle cx="37.1" cy="24.7" r="1" fill="#fff"/>

  <!-- Little arm reaching to the wrench -->
  <path fill="url(#ghostGrad)" d="M42 37c2.8 0 5.6 1.1 7.8 3.1l-3 3.2C45.4 45 43.8 44.6 42 44.6z"/>

  <!-- Open-end wrench, held out to the lower-right -->
  <g transform="rotate(45 52 47)">
    <!-- handle -->
    <rect x="49.9" y="41" width="4.2" height="16" rx="2.1" fill="url(#wrenchGrad)"/>
    <!-- open-end head with U-shaped jaw -->
    <path fill="url(#wrenchGrad)" fill-rule="evenodd" d="M52 34.5a7 7 0 0 0-7 7 7 7 0 0 0 4 6.3v-3.4a3.6 3.6 0 1 1 6 0v3.4a7 7 0 0 0 4-6.3 7 7 0 0 0-7-7zm-2.4 4.1h4.8l1.9 2-1.9 2h-4.8l-1.9-2z"/>
  </g>
</svg>
